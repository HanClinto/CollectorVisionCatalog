name: Deploy Catalog Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "catalog-feed-v2.json"
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble catalog mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="site/catalog-v2"
          mkdir -p "$root"
          cp catalog-feed-v2.json "$root/catalog-feed-v2.json"

          while IFS=$'\t' read -r version filename; do
            destination="$root/$version"
            mkdir -p "$destination"
            gh release download "$version" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir "$destination"
          done < <(python - <<'PY'
          import json
          from urllib.parse import unquote, urlparse

          with open("catalog-feed-v2.json") as stream:
              feed = json.load(stream)
          files = set()
          for entry in feed["catalogs"].values():
              for stage in [entry["base"], *entry["deltas"]]:
                  version = stage.get("version", stage.get("to"))
                  references = [stage["manifest"], *stage["assets"].values()]
                  for reference in references:
                      filename = unquote(urlparse(reference["url"]).path).rsplit("/", 1)[-1]
                      files.add((version, filename))
          for version, filename in sorted(files):
              print(version, filename, sep="\t")
          PY
          )

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
