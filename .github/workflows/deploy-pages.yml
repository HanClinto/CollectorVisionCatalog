name: Deploy Catalog Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "catalog-feed-v2.json"
      - "catalog-publication-v2.json"
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble catalog mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root="site/catalog-v2"
          mkdir -p "$root"
          cp catalog-feed-v2.json "$root/catalog-feed-v2.json"
          cp catalog-publication-v2.json "$root/catalog-publication-v2.json"
          mkdir -p release-assets

          while IFS= read -r release; do
            destination="release-assets/$release"
            mkdir -p "$destination"
            gh release download "$release" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$destination"
          done < <(python - <<'PY'
          import json

          with open("catalog-publication-v2.json") as stream:
              publication = json.load(stream)
          for release in publication["releases"]:
              print(release)
          PY
          )

          ROOT="$root" python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          for source in Path("release-assets").glob("*/*"):
              public_name, version, relative = source.name.split(".", 2)
              version_number = version.removeprefix("v")
              if relative.startswith(("base.", "delta-from-")):
                  parent, relative = relative.split(".", 1)
                  destination = (
                      root / public_name / "version" / version_number / parent / relative
                  )
              else:
                  destination = root / public_name / "version" / version_number / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              source.rename(destination)
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
