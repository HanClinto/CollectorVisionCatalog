name: Weekly Catalog v2 Release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: write

concurrency:
  group: catalog-v2-weekly-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install builder
        run: |
          python -m pip install -e .
          python -m pip install onnxruntime \
            "collectorvision[hf] @ git+https://github.com/HanClinto/CollectorVision.git@9d45a37ebfe40f22ece70507015645de134dc3ec"

      - name: Resolve previous v2 release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-cache
          if tag="$(gh release list --repo "$GITHUB_REPOSITORY" \
            --limit 1 --json tagName --jq '.[0].tagName // empty')" && [ -n "$tag" ]; then
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release-cache
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Await seed release
        if: steps.previous.outputs.available != 'true'
        run: |
          echo "::notice::No Catalog v2 seed release exists yet."
          echo "Build the first release locally with --allow-full-rebuild and publish it."

      - name: Compute release version
        if: steps.previous.outputs.available == 'true'
        id: release
        run: |
          echo "version=catalog-v2-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build incremental catalogs
        if: steps.previous.outputs.available == 'true'
        env:
          COLLECTORVISION_PROVIDER: cpu
        run: |
          python scripts/update_catalogs.py \
            --previous-dir release-cache \
            --output-dir release \
            --version "${{ steps.release.outputs.version }}"

      - name: Check for changes
        if: steps.previous.outputs.available == 'true'
        id: changes
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          summary = json.loads(Path("release/update-summary.json").read_text())
          print(f"changed={'true' if summary['changed'] else 'false'}")
          PY

      - name: Publish immutable release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CollectorVision Catalog v2 ${{ steps.release.outputs.version }}" \
            --notes "Automated full snapshots and one-step deltas. Start with catalog-index-v2.json." \
            release/*
